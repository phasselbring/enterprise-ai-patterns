[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-ai-patterns"
version = "0.3.0"
description = "Reference implementations for governed enterprise AI systems"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "sqlglot>=26"]
sql = ["sqlglot>=26"]
rerank = ["sentence-transformers>=5,<6"]
mcp = ["mcp>=2,<3", "anyio>=4"]
all = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "sqlglot>=26",
  "sentence-transformers>=5,<6",
  "mcp>=2,<3",
  "anyio>=4",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
